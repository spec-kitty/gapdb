directives:
  directives:
  - id: GAP-001
    title: Fail Closed on Authority and Durability
    description: >-
      Never falsely acknowledge durable state, expose a partial atomic commit,
      silently skip retained watch history, resurrect expired authority, grant
      authority from corrupt or uncertain state, or perform destructive recovery
      without an explicit guarded command. Violations block merge and release.
    severity: error
  - id: GAP-002
    title: Preserve the Small System Boundary
    description: >-
      Keep Gapdb a local in-memory key-value coordination store with one mutation
      owner and explicit persistence. New SQL, query-planning, indexing,
      distribution, consensus, lock-free, or embedded-model machinery requires a
      separately approved mission proving that the existing boundary cannot meet
      the need.
    severity: error
  - id: GAP-003
    title: Operate Through Stable Evidence
    description: >-
      Every routine and recovery workflow must be available through bounded,
      versioned, non-interactive machine-readable interfaces. Automation branches
      on stable fields and error codes, never advisory prose. State-changing
      administration requires explicit identity or revision preconditions.
    severity: error
  - id: GAP-004
    title: Version and Verify Durable Formats
    description: >-
      Every wire and persisted format carries an explicit version and integrity
      check. Unknown versions and non-tail corruption fail without mutation.
      Snapshot installation and log retirement occur only after verification and
      successful durability barriers.
    severity: error
  - id: GAP-005
    title: Bound Every Resource
    description: >-
      Requests, values, batches, scans, watch buffers, queues, retained history,
      and diagnostic output have discoverable limits and explicit overflow or
      lag behavior. Unbounded growth and silent dropping are prohibited.
    severity: error
  - id: GAP-006
    title: Earn Replacement of SQLite
    description: >-
      SQLite remains the production fallback until Gapdb passes the originating
      application's contract, fault-injection, crash-recovery, concurrency, and
      authority-safety gates. Adoption requires explicit human approval based on
      recorded evidence.
    severity: error
  - id: GAP-007
    title: Govern Exceptions Explicitly
    description: >-
      An exception requires explicit human approval, narrow scope, rationale,
      risk assessment, compensating control, named owner, expiry date, and
      rollback plan. Exceptions may not waive false-durability, partial-commit,
      corrupt-authority, or silent-destructive-recovery prohibitions. Expired
      exceptions fail closed.
    severity: error
